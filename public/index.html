<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Contractor CRM</title>
<style>
  :root{
    --ink:#1c2321; --paper:#f7f5f0; --brass:#a9762f; --brass-dark:#7d5720;
    --pipe:#2f5d62; --pipe-dark:#1f4448; --rust:#b5462f; --ok:#3d7a4f;
    --warn:#c98a1f; --line:#d8d2c4; --card:#ffffff; --muted:#6b6558;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Georgia',serif;background:var(--paper);color:var(--ink);}
  .mono{font-family:'Courier New',monospace;}
  header.app{
    position:sticky;top:0;z-index:50;background:var(--pipe-dark);color:var(--paper);
    padding:14px 16px 12px;border-bottom:4px solid var(--brass);
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  header.app h1{margin:0;font-size:1.15rem;letter-spacing:0.04em;font-weight:700;}
  header.app button.logout{background:none;border:1px solid var(--paper);color:var(--paper);
    border-radius:4px;padding:5px 10px;font-family:'Courier New',monospace;font-size:0.7rem;cursor:pointer;opacity:0.8;}
  nav.tabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--pipe-dark);overflow-x:auto;}
  nav.tabs button{flex:0 0 auto;background:transparent;border:none;color:var(--paper);opacity:0.55;
    font-family:'Courier New',monospace;font-size:0.78rem;letter-spacing:0.03em;padding:10px 12px 12px;
    border-bottom:3px solid transparent;cursor:pointer;}
  nav.tabs button.active{opacity:1;border-bottom-color:var(--brass);color:#fff;}
  main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:60px;}

  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .toolbar input, .toolbar select{flex:1;min-width:120px;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}
  .btn{display:inline-block;background:var(--pipe);color:#fff;border:none;border-radius:6px;
    padding:9px 14px;font-family:'Courier New',monospace;font-size:0.78rem;cursor:pointer;text-align:center;}
  .btn.block{display:block;width:100%;}
  .btn.brass{background:var(--brass);}
  .btn.rust{background:var(--rust);}
  .btn.secondary{background:#fff;color:var(--pipe-dark);border:1px solid var(--line);}
  .btn.small{padding:5px 9px;font-size:0.68rem;}

  .lead-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .lead-card h3{margin:0 0 4px;font-size:1rem;}
  .lead-card .meta{font-size:0.78rem;color:var(--muted);font-family:'Courier New',monospace;}
  .badge{display:inline-block;font-family:'Courier New',monospace;font-size:0.62rem;padding:3px 7px;
    border-radius:4px;background:var(--line);color:var(--ink);text-transform:uppercase;margin-top:6px;}
  .badge.New{background:#dbe6ee;} .badge.Responded{background:#d9ecd9;}
  .badge.Declined{background:#f3d9d3;} .badge.Sent{background:#eee7d6;}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}

  .import-area textarea{width:100%;min-height:120px;font-family:'Courier New',monospace;font-size:0.8rem;padding:8px;}
  .dup-list{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;margin-top:8px;}
  .dup-row{display:flex;justify-content:space-between;padding:6px 4px;font-size:0.82rem;border-bottom:1px solid var(--line);}
  .dup-row:last-child{border-bottom:none;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;}
  .modal{background:var(--paper);width:100%;max-height:90vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px;}
  .field-row{margin-bottom:12px;}
  .field-row label{display:block;font-family:'Courier New',monospace;font-size:0.68rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .field-row input, .field-row select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}

  .activity-list{margin-top:8px;}
  .activity-entry{border-bottom:1px solid var(--line);padding:8px 0;font-size:0.85rem;}
  .activity-entry .ts{font-family:'Courier New',monospace;font-size:0.65rem;color:var(--muted);}
  .note-add{display:flex;gap:6px;margin-top:10px;}
  .note-add input{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;}

  .loading-msg{text-align:center;padding:60px 20px;color:var(--muted);font-family:'Courier New',monospace;}
</style>
</head>
<body>

<header class="app">
  <div>
    <h1>🔧 Contractor CRM</h1>
  </div>
  <button class="logout" id="logoutBtn">Log out</button>
</header>

<nav class="tabs">
  <button data-tab="leads" class="active">Leads</button>
  <button data-tab="import">Import</button>
</nav>

<main id="mainArea"><div class="loading-msg">Loading…</div></main>
<div id="modalRoot"></div>

<script>
(function(){

const OUTREACH_STATUSES = ['New','Mockup Generated','Sent to Prospect','Followed Up','Responded','Declined'];

let state = { leads: [], activeTab: 'leads', filterStatus: 'all', searchQuery: '' };

async function api(path, opts) {
  const res = await fetch('/api' + path, {
    headers: {'Content-Type':'application/json'},
    ...opts,
  });
  if (res.status === 401) { window.location.href = '/login.html'; throw new Error('unauthenticated'); }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ('Request failed: ' + res.status));
  }
  if (res.status === 204) return null;
  return res.json();
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadLeads(){
  state.leads = await api('/leads');
}

function filteredLeads(){
  return state.leads.filter(l => {
    if (state.filterStatus !== 'all' && l.outreach_status !== state.filterStatus) return false;
    if (state.searchQuery && !l.business_name.toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
    return true;
  });
}

function render(){
  const main = document.getElementById('mainArea');
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.activeTab));
  if (state.activeTab === 'leads') main.innerHTML = renderLeads();
  else main.innerHTML = renderImport();
  attachHandlers();
}

function renderLeads(){
  const leads = filteredLeads();
  let html = `
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by name…" value="${escapeHtml(state.searchQuery)}">
      <select id="statusFilter">
        <option value="all">All statuses</option>
        ${OUTREACH_STATUSES.map(s => `<option value="${s}" ${state.filterStatus===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <button class="btn block brass" id="addLeadBtn" style="margin-bottom:14px;">+ Add Lead</button>
  `;
  if (!leads.length) {
    html += `<div class="empty">No leads match. Try the Import tab to load some.</div>`;
  } else {
    leads.forEach(l => {
      html += `
      <div class="lead-card" data-id="${l.id}">
        <h3>${escapeHtml(l.business_name)}</h3>
        <div class="meta">${escapeHtml(l.phone||'no phone')} · ${escapeHtml(l.address||'no address')}</div>
        <span class="badge ${l.outreach_status.replace(/ .*/,'')}">${escapeHtml(l.outreach_status)}</span>
      </div>`;
    });
  }
  return html;
}

function renderImport(){
  return `
  <div class="field-row"><label>Search Google Places</label></div>
  <div class="field-row"><input type="text" id="placesLocation" placeholder="City, State (e.g. Dayton, OH)"></div>
  <div class="field-row"><input type="text" id="placesType" placeholder="Business type" value="plumber"></div>
  <button class="btn block brass" id="placesSearchBtn">Search &amp; Import</button>
  <div id="placesResult"></div>

  <div class="field-row" style="margin-top:24px;"><label>Paste Leads to Import</label></div>
  <p style="font-size:0.82rem;color:var(--muted);margin-top:-8px;">One lead per line: <span class="mono">Name, Phone, Address</span> — phone/address optional.</p>
  <div class="import-area"><textarea id="importText" placeholder="Halpin Plumbing Inc, 513-790-6985, 5177 Fishwick Dr, Cincinnati OH"></textarea></div>
  <button class="btn block" id="previewImportBtn" style="margin-top:10px;">Import</button>
  <div id="importResult"></div>
  `;
}

function renderImportSummary(result){
  let html = `<p style="color:var(--ok);font-size:0.85rem;">✓ Imported ${result.created.length} new lead${result.created.length===1?'':'s'}.</p>`;
  if (result.duplicates.length) {
    html += `<div class="dup-list">`;
    result.duplicates.forEach(d => {
      const name = (d.incoming.name || d.incoming.business_name || '');
      html += `<div class="dup-row"><span>${escapeHtml(name)}</span><span style="color:var(--muted);">matches "${escapeHtml(d.existing.business_name)}"</span></div>`;
    });
    html += `</div>`;
  }
  return html;
}

function attachHandlers(){
  const search = document.getElementById('searchInput');
  if (search) search.oninput = e => { state.searchQuery = e.target.value; render(); };
  const sf = document.getElementById('statusFilter');
  if (sf) sf.onchange = e => { state.filterStatus = e.target.value; render(); };
  const addBtn = document.getElementById('addLeadBtn');
  if (addBtn) addBtn.onclick = () => openLeadModal(null);
  document.querySelectorAll('.lead-card').forEach(card => {
    card.onclick = () => openLeadModal(card.dataset.id);
  });

  const importBtn = document.getElementById('previewImportBtn');
  if (importBtn) importBtn.onclick = async () => {
    const text = document.getElementById('importText').value;
    if (!text.trim()) return;
    importBtn.disabled = true;
    try {
      const result = await api('/leads/import', { method: 'POST', body: JSON.stringify({ text }) });
      document.getElementById('importResult').innerHTML = renderImportSummary(result);
      document.getElementById('importText').value = '';
      await loadLeads();
    } catch (e) {
      document.getElementById('importResult').innerHTML = `<p style="color:var(--rust);">${escapeHtml(e.message)}</p>`;
    }
    importBtn.disabled = false;
  };

  const placesBtn = document.getElementById('placesSearchBtn');
  if (placesBtn) placesBtn.onclick = async () => {
    const location = document.getElementById('placesLocation').value.trim();
    const businessType = document.getElementById('placesType').value.trim() || 'plumber';
    if (!location) { alert('Enter a location'); return; }
    placesBtn.disabled = true;
    document.getElementById('placesResult').innerHTML = `<p style="font-size:0.82rem;color:var(--muted);">Searching…</p>`;
    try {
      const result = await api('/leads/import/places', { method: 'POST', body: JSON.stringify({ location, businessType }) });
      document.getElementById('placesResult').innerHTML = renderImportSummary(result);
      await loadLeads();
    } catch (e) {
      document.getElementById('placesResult').innerHTML = `<p style="color:var(--rust);">${escapeHtml(e.message)}</p>`;
    }
    placesBtn.disabled = false;
  };
}

async function openLeadModal(id){
  const isNew = !id;
  let lead = isNew
    ? { id:null, business_name:'', phone:'', address:'', website:'', email:'', decision_maker:'', outreach_status:'New', activity: [] }
    : await api('/leads/' + id);

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="field-row"><label>Business Name</label><input id="f_name" value="${escapeHtml(lead.business_name)}"></div>
      <div class="field-row"><label>Phone</label><input id="f_phone" value="${escapeHtml(lead.phone)}"></div>
      <div class="field-row"><label>Address</label><input id="f_address" value="${escapeHtml(lead.address)}"></div>
      <div class="field-row"><label>Website</label><input id="f_website" value="${escapeHtml(lead.website)}"></div>
      <div class="field-row"><label>Email</label><input id="f_email" value="${escapeHtml(lead.email)}"></div>
      <div class="field-row"><label>Decision Maker</label><input id="f_dm" value="${escapeHtml(lead.decision_maker)}"></div>
      <div class="field-row"><label>Outreach Status</label>
        <select id="f_status">${OUTREACH_STATUSES.map(s => `<option value="${s}" ${lead.outreach_status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      ${isNew ? '' : `
      <div class="field-row"><label>Activity Log</label></div>
      <div class="activity-list">
        ${lead.activity.length ? lead.activity.map(a => `
          <div class="activity-entry"><div class="ts">${new Date(a.created_at).toLocaleString()}</div><div>${escapeHtml(a.text)}</div></div>
        `).join('') : '<p style="font-size:0.8rem;color:var(--muted);">No notes yet.</p>'}
      </div>
      <div class="note-add">
        <input type="text" id="noteInput" placeholder="Add a note…">
        <button class="btn small" id="addNoteBtn">Add</button>
      </div>
      `}
      <div class="modal-actions">
        <button class="btn brass block" id="saveLeadBtn">${isNew ? 'Create Lead' : 'Save Changes'}</button>
      </div>
      ${isNew ? '' : '<button class="btn rust block" id="deleteLeadBtn" style="margin-top:8px;">Delete Lead</button>'}
      <button class="btn secondary block" id="closeModalBtn" style="margin-top:8px;">Close</button>
    </div>
  </div>`;

  document.getElementById('modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };
  document.getElementById('closeModalBtn').onclick = closeModal;

  document.getElementById('saveLeadBtn').onclick = async () => {
    const payload = {
      business_name: document.getElementById('f_name').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      website: document.getElementById('f_website').value.trim(),
      email: document.getElementById('f_email').value.trim(),
      decision_maker: document.getElementById('f_dm').value.trim(),
      outreach_status: document.getElementById('f_status').value,
    };
    if (!payload.business_name) { alert('Business name is required'); return; }
    try {
      if (isNew) await api('/leads', { method: 'POST', body: JSON.stringify(payload) });
      else await api('/leads/' + lead.id, { method: 'PATCH', body: JSON.stringify(payload) });
      closeModal();
      await loadLeads();
      render();
    } catch (e) { alert(e.message); }
  };

  if (!isNew) {
    document.getElementById('addNoteBtn').onclick = async () => {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;
      await api('/leads/' + lead.id + '/notes', { method: 'POST', body: JSON.stringify({ text }) });
      openLeadModal(lead.id);
    };
    document.getElementById('deleteLeadBtn').onclick = async () => {
      if (!confirm('Delete this lead? This cannot be undone.')) return;
      await api('/leads/' + lead.id, { method: 'DELETE' });
      closeModal();
      await loadLeads();
      render();
    };
  }
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); };
});
document.getElementById('logoutBtn').onclick = async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
};

(async function init(){
  try {
    await loadLeads();
    render();
  } catch (e) {
    if (e.message !== 'unauthenticated') {
      document.getElementById('mainArea').innerHTML = `<div class="empty">Failed to load: ${escapeHtml(e.message)}</div>`;
    }
  }
})();

})();
</script>
</body>
</html>
