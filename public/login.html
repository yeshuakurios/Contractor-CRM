<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — Contractor CRM</title>
<style>
  body{font-family:sans-serif;background:#1c2321;color:#f7f5f0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  form{background:#2f5d62;padding:24px;border-radius:8px;width:260px;}
  input{width:100%;box-sizing:border-box;margin-bottom:10px;padding:8px;border-radius:4px;border:none;}
  button{width:100%;padding:8px;border-radius:4px;border:none;background:#a9762f;color:#fff;cursor:pointer;}
  p{color:#e06;font-size:0.85rem;}
</style>
</head>
<body>
<form id="f">
  <h2 style="margin-top:0;">Log in</h2>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Log in</button>
  <p id="err"></p>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });
  if (res.ok) window.location.href = '/index.html';
  else document.getElementById('err').textContent = 'Invalid credentials';
};
</script>
</body>
</html>
